name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained BPet
        run: dotnet publish BPet.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.VERSION }} -o publish
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Create installer
        shell: pwsh
        run: |
          $env:BPET_VERSION = "${{ env.VERSION }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\BPet.iss"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: BPet v${{ env.VERSION }}
          generate_release_notes: true
          files: installer/output/BPet-Setup.exe
